# Reverse proxy delante de la API.
# Docker resuelve "api" a todas las réplicas: probá `docker compose up -d --scale api=3`
# y llamá varias veces a http://localhost:8080/ para ver cambiar el hostname.

upstream tasks_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # No exponer /metrics hacia afuera: Prometheus lo lee por la red interna.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass         http://tasks_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
