# Pipeline de CI/CD:
#   1. lint + tests unitarios
#   2. build de la imagen + escaneo de vulnerabilidades (Trivy)
#   3. test de integración: levanta todo con docker compose y corre el smoke test
#   4. validación de infraestructura (Terraform, Kubernetes, Helm)
#   5. push de la imagen a GitHub Container Registry (solo en main o tags v*)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tasks-api

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --cov=api --cov-report=term-missing --cov-fail-under=70

  build-and-scan:
    name: Build + escaneo de seguridad
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t tasks-api:ci --build-arg APP_VERSION=${{ github.sha }} app
      - name: Escaneo con Trivy (falla con vulnerabilidades CRITICAL corregibles)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity CRITICAL \
            --ignore-unfixed --no-progress tasks-api:ci

  integration:
    name: Test de integración (docker compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  iac:
    name: Validar infraestructura como código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive terraform/
          for dir in terraform/local terraform/aws; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/tasks-api
      - name: Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/overlays/dev  | ./kubeconform -strict -summary -ignore-missing-schemas
          kubectl kustomize k8s/overlays/prod | ./kubeconform -strict -summary -ignore-missing-schemas
          helm template helm/tasks-api        | ./kubeconform -strict -summary -ignore-missing-schemas

  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: [build-and-scan, integration, iac]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
