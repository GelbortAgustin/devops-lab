apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tasks

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-ingress.yaml
  - api-hpa.yaml

# OJO: secretGenerator con literales está bien SOLO para practicar.
# En un entorno real: Sealed Secrets, External Secrets o el gestor del cloud.
secretGenerator:
  - name: postgres-credentials
    options:
      disableNameSuffixHash: true  # nombre fijo, así Helm lo puede referenciar
    literals:
      - POSTGRES_USER=tasks
      - POSTGRES_PASSWORD=tasks-dev-password
      - POSTGRES_DB=tasks
      - DATABASE_URL=postgresql+psycopg://tasks:tasks-dev-password@postgres:5432/tasks

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-lab
