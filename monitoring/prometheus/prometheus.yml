global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Con docker compose, el DNS "api" resuelve a todas las réplicas.
  - job_name: tasks-api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
    metrics_path: /metrics
